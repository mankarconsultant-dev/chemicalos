const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function analyse(r,qs){
  const cc={};qs.forEach(q=>cc[q.cur]=(cc[q.cur]||0)+1);const base=Object.keys(cc).sort((a,b)=>cc[b]-cc[a])[0];

    if(!q.grade)fl.push(["warn","Grade not stated"]);else if(r.grade&&norm(q.grade)!==norm(r.grade)&&!norm(q.grade).includes(norm(r.grade))&&!norm(r.grade).includes(norm(q.grade)))fl.push(["bad","Grade differs: asked "+r.grade]);
    if(q.moq==null)fl.push(["warn","MOQ not stated"]);else if(q.moq>r.qty)fl.push(["bad","MOQ is above the quantity needed"]);
    if(q.lead==null)fl.push(["warn","Lead time not stated"]);
    if(q.ft==="unknown")fl.push(["warn","Freight not stated, delivered cost unknown"]);else if(q.ft==="extra"&&q.fa==null)fl.push(["warn","Freight amount missing"]);
    if(!q.pay)fl.push(["warn","Payment terms missing"]);
    (r.docs||["COA","SDS"]).forEach(d=>{if(!q.docs.includes(d))fl.push(["warn","Missing required document: "+d])});
    if(q.cur!==base)fl.push(["warn","Different currency; no conversion is done"]);
    if(q.val&&Date.now()>q.created+q.val*864e5)fl.push(["warn","Quote validity has expired"]);
    const W={g:.001,kg:1,MT:1000},pu=q.pu||r.unit;let eff=q.price;
    if(pu!==r.unit){if(W[pu]&&W[r.unit])eff=q.price*W[r.unit]/W[pu];else{eff=null;fl.push(["bad","Price is per "+pu+" but the RFQ is in "+r.unit+"; cannot convert"])}}
    const tx=q.tx||"unknown";if(tx==="unknown")fl.push(["warn","Taxes not stated; total excludes tax"]);
    const rate=(tx!=="included"&&tx!=="unknown")?+tx/100:0;
    const total=(eff!=null&&(q.ft==="included"||(q.ft==="extra"&&q.fa!=null)))?(eff*r.qty+(q.ft==="extra"?q.fa:0))*(1+rate):null;
    return{q,fl,total,eff,base,bad:fl.some(x=>x[0]==="bad")};});
}

function rAcct(){$("#v-acct").innerHTML=`<h2>Account</h2><div class="card" style="margin-bottom:12px"><b>Not signed in</b><p class="mut" style="margin:4px 0 8px">Real accounts are not connected yet. Everything below works on this device only.</p><button class="btn sm" onclick="go('auth')">Sign in or create account</button></div><div class="grid g2">${Object.values(GR).map(g=>`<div class="card"><h3>${g[0]}</h3>${g[1].map(([k,l])=>`<div class="item"><span>${l}</span><button class="btn sm sec" onclick="go('${k}')">Open</button></div>`).join("")}</div>`).join("")}</div><div class="card" style="margin-top:12px"><h3>Needs the shared database (Supabase)</h3><ul class="mut sm" style="margin:0;padding-left:18px"><li>Sign-in, supplier and buyer accounts</li><li>Listings and RFQs shared between users</li><li>Private RFQs and quotations</li><li>Supplier verification and document storage</li><li>Real join dates, rankings and order history</li></ul></div>`}
function rMarket(){

  $("#v-market").innerHTML=`<div class="sh"><h2 style="margin:0">${mk.cat?esc(mk.cat):"All chemicals"}</h2><button class="btn sm" onclick="prefill={chem:mk.q};go('buyer')">Post Requirement</button></div>

  <details class="flt"><summary>Filters and sorting</summary><div class="row">${sel("sort",[["new","Newest first"],["price","Price, low to high"],["moq","MOQ, low to high"],["name","Name A to Z"]])}${sel("type",[["","Any listing type"],["direct","Direct order"],["quote","Quote required"]])}</div>
  <div class="row" style="margin-top:8px"><input value="${esc(mk.grade)}" placeholder="Grade" oninput="mk.grade=this.value;mkList()"><input value="${esc(mk.loc)}" placeholder="Delivery location" oninput="mk.loc=this.value;mkList()"></div>

  <div id="cnt" class="mut nt"></div>${REG.includes(mk.cat)?'<div class="banner">Some products in this category are regulated or hazardous. Buying may need documents, permits or buyer checks, and many items are RFQ only.</div>':""}<div id="ml" class="pg"></div>`;mkList();

function mkList(){const q=mk.q.toLowerCase().trim(),g=mk.grade.toLowerCase().trim();
  const L=LS().filter(l=>(mk.demo==="1"||!l.demo)&&(!q||[l.name,l.syn,l.cas,l.cat,l.sup].join(" ").toLowerCase().includes(q))&&(!mk.cat||l.cat===mk.cat)&&(!g||(l.grade||"").toLowerCase().includes(g))&&(!mk.type||(mk.type==="direct"?canDirect(l):l.ptype==="quote"))&&(!mk.sup||(mk.sup==="v")===isV(l))&&(!mk.pmax||(l.price!=null&&l.price<=+mk.pmax))&&(!mk.mmax||(l.moq!=null&&l.moq<=+mk.mmax))&&(!mk.loc||(l.cover||"").toLowerCase().includes(mk.loc.toLowerCase()))&&(!mk.av||(l.status==="Active"&&(l.avail==null||l.avail>0))));
  L.sort(({new:(a,b)=>b.created-a.created,price:(a,b)=>(a.price==null)-(b.price==null)||a.price-b.price,moq:(a,b)=>(a.moq==null)-(b.moq==null)||a.moq-b.moq,name:(a,b)=>a.name.localeCompare(b.name)})[mk.sort||"new"]);
  $("#cnt").textContent=L.length+" result(s)"+(mk.demo==="1"?" · includes fictional demo listings":"");
  const real=LS().filter(l=>!l.demo).length;
  $("#ml").innerHTML=L.length?L.map(card).join(""):`<div class="card" style="grid-column:1/-1"><b>No verified listings match.</b><p class="mut">${real?"Try a different search or filter.":"There are no real listings yet. Suppliers can add one in the Listings tab. Nothing is verified until a verification is recorded."}</p><div class="acts"><button class="btn" onclick="prefill={chem:mk.q};go('buyer')">Post a requirement instead</button></div></div>`}
function mkDetail(){const l=LS().find(x=>x.id===mk.det);if(!l){mk.det=null;return rMarket()}
  const why=directWhy(l),R=(a,b)=>`<div class="item"><span class="mut">${a}</span><span style="text-align:right">${b}</span></div>`,e=x=>esc(x||"not stated");
  $("#v-market").innerHTML=`<button class="btn sm sec" onclick="mk.det=null;rMarket()">Back to listings</button><h2 style="margin-top:12px">${esc(l.name)} ${tags(l)}</h2>${l.demo?'<div class="banner">Fictional demo listing. The supplier, price and stock are invented and not verified.</div>':""}<div class="card">
  ${R("Synonyms",e(l.syn))}${R("CAS",e(l.cas))}${R("Category",e(l.cat))}${R("Application",e(l.app))}${R("Grade",e(l.grade))}${R("Specifications",e(l.spec))}${R("Manufacturer / brand",e(l.mfr))}${R("Packaging",e(l.pack))}${R("Available",l.avail!=null?esc(l.avail+" "+l.unit):"not stated")}${R("MOQ",l.moq!=null?esc(l.moq+" "+l.unit):"not stated")}${R("Price",priceTxt(l))}${R("Freight / tax",esc("Freight: "+({included:"included",extra:"extra, quoted separately"}[l.ft]||"not stated")+" · Tax: "+(l.tx==="included"?"included":!l.tx||l.tx==="unknown"?"not stated":"extra "+l.tx+"%")))}${R("Supplier",esc(l.sup)+' <span class="mut">('+esc(vs(l))+")</span>")}${R("Lead time",l.lead!=null?esc(l.lead+" days"):"not stated")}${R("Delivery coverage",e(l.cover))}${R("Documents",l.docs&&l.docs.length?esc(l.docs.join(", "))+' <span class="mut">(listed by supplier, not reviewed)</span>':"none listed")}${R("Compliance",l.restricted==="Standard"?"No restriction recorded (this is not a compliance check)":"Restricted or regulated: RFQ only")}</div>
  <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Path A: direct order request</h3>${why?`<p class="mut">Not available: ${esc(why)}</p>`:`<label>Quantity (${esc(l.unit)})</label><input id="oq" type="number" step="any" min="0" oninput="calcOrder()"><div id="oc" class="mut" style="margin-top:8px">Enter a quantity.</div><div class="acts"><button class="btn" onclick="saveOrder()">Save order request</button></div>`}</div>
  <div class="card"><h3>Path B: RFQ and negotiation</h3><p class="mut">Use this for bulk, negotiated or customized buying.</p><div class="acts"><button class="btn sec" onclick="prefill={chem:'${esc(l.name.replace(/ \(fictional demo listing\)/,"").replace(/'/g,""))}',cas:'${esc(l.cas)}',grade:'${esc((l.grade||"").replace(/'/g,""))}'};go('buyer')">Create RFQ from this listing</button></div></div></div>`;if(!why)calcOrder();
}
function calcOrder(){const l=LS().find(x=>x.id===mk.det),q=num(($("#oq")||{}).value),o=$("#oc");if(!l||!o)return null;
  if(!q||q<=0){o.innerHTML="Enter a quantity.";return null}
  if(q<l.moq){o.innerHTML=`<span class="fl bad">Below the MOQ of ${esc(l.moq+" "+l.unit)}.</span>`;return null}
  if(q>l.avail){o.innerHTML=`<span class="fl bad">Above the available ${esc(l.avail+" "+l.unit)}.</span>`;return null}
  const sub=q*l.price,rate=(l.tx&&l.tx!=="included"&&l.tx!=="unknown")?+l.tx/100:0,tax=sub*rate;
  o.innerHTML=`<div>Product subtotal: <b>${esc(money(sub,l.cur))}</b></div><div>Freight: ${esc({included:"included in price",extra:"extra, supplier to quote"}[l.ft]||"not stated")}</div><div>Tax: ${l.tx==="included"?"included in price":rate?esc(money(tax,l.cur))+" ("+esc(l.tx)+"% extra, applied to product only)":"not stated, not added"}</div><div>Estimated total without freight: <b>${esc(money(sub+tax,l.cur))}</b></div><div class="fl warn">Assumes the supplier’s listed price is still valid. This is an estimate, not an invoice.</div>`;
  return{sub,tax}}
function saveOrder(){const l=LS().find(x=>x.id===mk.det),c=calcOrder();if(!c){toast("Fix the quantity first.");return}
  OS().unshift({id:uid(),listing:l.id,lname:l.name,sup:l.sup,qty:num($("#oq").value),unit:l.unit,price:l.price,cur:l.cur,sub:c.sub,tax:c.tax,status:"Draft request",demo:l.demo,created:Date.now()});
  log("Order request drafted: "+l.name);save();toast("Draft saved. Not an order until the supplier confirms.");go("listings")}

function saveListing(e){e.preventDefault();const f=new FormData(e.target),g=k=>(f.get(k)||"").toString().trim(),o=LS().find(x=>x.id===edL),cas=g("cas"),pt=g("ptype"),price=num(g("price"));

  if(cas&&!/^\d{2,7}-\d{2}-\d$/.test(cas)){toast("CAS format looks wrong, e.g. 56-81-5.");return}
  if(pt!=="quote"&&!(price>0)){toast("Enter a price above zero, or choose Quote required.");return}
  if(pt==="fixed"&&!g("pdate")){toast("A fixed price needs the date it was confirmed.");return}
  const n={name:g("name"),syn:g("syn"),cas,cat:g("cat"),app:g("app"),grade:g("grade"),spec:g("spec"),mfr:g("mfr"),pack:g("pack"),avail:num(g("avail")),unit:g("unit")||"kg",moq:num(g("moq")),ptype:pt,price:pt==="quote"?null:price,cur:g("cur")||"INR",pdate:g("pdate"),sup:g("sup"),lead:num(g("lead")),cover:g("cover"),docs:f.getAll("d"),restricted:g("restricted")||"Standard",ft:g("ft")||"unknown",tx:g("tx")||"unknown",status:g("status")||"Draft"};
  if(o)Object.assign(o,n);else LS().unshift(Object.assign({id:uid(),verif:{status:"Unverified",note:""},demo:false,created:Date.now()},n));

const ICON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>';
let SUPN=[];
function hs(e){e.preventDefault();mk.q=$("#hq").value;mk.det=null;go("market")}
function renderCat(){$("#catbar").innerHTML=`<button class="${mk.cat?"":"on"}" onclick="mk.cat='';mk.det=null;go('market')">All</button>`+CATS.map(c=>`<button class="${mk.cat===c?"on":""}" onclick="mk.cat='${c}';mk.det=null;go('market')">${c}</button>`).join("")}
function supGo(i){mk.q=SUPN[i];mk.det=null;go("market")}
function supData(){const sup={};LS().forEach(l=>{const s=sup[l.sup]||(sup[l.sup]={n:0,demo:true,v:false,first:l.created});s.n++;s.first=Math.min(s.first,l.created);s.v=s.v||isV(l);s.demo=s.demo&&l.demo});SUPN=Object.keys(sup).sort((a,b)=>(sup[a].demo-sup[b].demo)||sup[b].first-sup[a].first);return sup}
const empty=(t,m,x)=>`<div class="empty"><span class="ci">${ICON}</span><div><b>${t}</b><div class="mut">${m}</div><div class="acts" style="margin-top:8px"><button class="btn sm" onclick="go('listings')">List a product</button><button class="btn sm sec" onclick="go('buyer')">Post Requirement</button>${x||""}</div></div></div>`;
function rSup(){const sup=supData(),R=SUPN.filter(n=>!sup[n].demo),D=SUPN.filter(n=>sup[n].demo);
  $("#v-sup").innerHTML=`<h2>Suppliers</h2>${R.length?`<div class="pg">${R.map(n=>supCard(n,SUPN.indexOf(n),sup)).join("")}</div>`:empty("No real suppliers yet","Supplier accounts need the shared database. Suppliers who list products appear here.")}${D.length?`<h3 style="margin-top:16px">Demo suppliers <span class="tag demo">fictional</span></h3><div class="pg">${D.map(n=>supCard(n,SUPN.indexOf(n),sup)).join("")}</div>`:""}`}
function browse(o){mk=Object.assign({q:"",cat:"",grade:"",type:"",sup:"",av:"1",demo:"1",det:null,pmax:"",mmax:"",loc:"",sort:"new"},o||{});go("market")}
const sh=(t,link,tag)=>`<div class="sh"><h2>${t}${tag||""}</h2>${link?`<button class="lk" onclick="${link}">View all</button>`:""}</div>`;
const DT='<span class="tag demo">includes demo data</span>';
const band=(t,link,tag,body,note,g)=>`<div class="${g?"band":"plain"}">${sh(t,link,tag)}${note?`<p class="mut nt">${note}</p>`:""}${body}</div>`;
const catTile=(c,n)=>`<button class="cat" onclick="browse({cat:'${c}'})"><span class="ci">${ICON}</span><span class="ct">${c}<small>${n}</small></span></button>`;
function supCard(n,i,sup){const s=sup[n];return `<div class="pc pp" onclick="supGo(${i})"><div class="pt"><span class="av">${esc(n.charAt(0))}</span>${s.demo?'<span class="tag demo">Fictional demo</span>':`<span class="tag ${s.v?"ok":""}">${s.v?"Verified":"Unverified"}</span>`}</div><b class="nm">${esc(n)}</b><div class="mut sm">${s.n} listing(s) · ${s.demo?"demo supplier, not real":"first listed "+fmtD(s.first)}</div></div>`}
function rHome(){
  const sup=supData();
  const newL=LS().filter(l=>!l.demo&&l.status==="Active").sort((a,b)=>b.created-a.created).slice(0,6);
  const newS=SUPN.filter(n=>!sup[n].demo).slice(0,4);
  const cnt=c=>LS().filter(l=>!l.demo&&l.status==="Active"&&l.cat===c).length,pop=CATS.filter(c=>cnt(c)).sort((a,b)=>cnt(b)-cnt(a)).slice(0,6);
  const demoBtn=a=>`<button class="btn sm sec" onclick="${a}">See demo examples</button>`;
  $("#v-home").innerHTML=`<div class="wel"><h1>Source chemicals, compare quotes</h1><p>Search above by name, CAS number or supplier, or post a requirement to get comparable quotations.</p><div class="fine">Prototype: data stays on this device. Demo examples are always labeled.</div></div>
  ${band("Browse chemical categories","browse()","",`<div class="grid cats">${CATS.map(c=>catTile(c,cnt(c)+" real listings")).join("")}</div>`,"Some categories include regulated or hazardous products. A listed category does not mean its products can be bought without checks; such items may be RFQ only and need documents, permits or buyer review.",1)}
  ${band("Newly listed chemicals","browse()","",newL.length?`<div class="pg">${newL.map(card).join("")}</div>`:empty("No real listings yet","Real supplier listings appear here, newest first.",demoBtn("browse()")))}
  ${band("Newly joined suppliers","go('sup')","",newS.length?`<div class="pg">${newS.map(n=>supCard(n,SUPN.indexOf(n),sup)).join("")}</div>`:empty("No real suppliers yet","A supplier appears here after its first real listing. Accounts and verification need Supabase.",demoBtn("go('sup')")),newS.length?"Join dates come from each supplier’s first listing.":"",1)}
  ${band("Popular categories","browse()","",pop.length?`<div class="grid cats">${pop.map(c=>catTile(c,cnt(c)+" listing(s)")).join("")}</div>`:`<div class="empty"><span class="ci">${ICON}</span><div><b>No category activity yet</b><div class="mut">Categories are ranked by real active listings.</div></div></div>`)}
  <div class="cta"><div><b>Post a requirement</b><div class="mut sm">Tell suppliers what you need and compare their quotations side by side.</div></div><div class="acts" style="margin:0"><button class="btn" onclick="go('buyer')">Post Requirement</button><button class="btn sec" onclick="go('listings')">Sell on ChemicalOS</button></div></div>`;
}
function rAuth(){$("#v-auth").innerHTML=`<div class="card auth"><img class="lg" src="${LOGO}" alt="ChemicalOS logo"><h2 style="margin-top:0">Sign in or create an account</h2><div class="banner">Accounts are not available yet. They need the shared database and access controls, which are not connected. The form is disabled so nobody types a password into a prototype.</div><label>Email</label><input disabled placeholder="you@company.com"><label>Password</label><input disabled type="password"><label>I am a</label><select disabled><option>Buyer</option><option>Supplier</option></select><div class="acts"><button class="btn" disabled>Sign in</button><button class="btn sec" onclick="go('market')">Continue as guest</button></div></div>`}
function rCatalog(){
  $("#v-catalog").innerHTML=`<h2>Chemical catalog</h2><input id="cs" placeholder="Search by name, CAS or category" oninput="catList()"><p class="mut" style="font-size:13px">Sample list for testing only. Check identity, grade and specifications with the supplier’s documents before ordering.</p><div id="cl" class="grid g2"></div>`;catList();
}
function catList(){const q=($("#cs").value||"").toLowerCase();const L=CAT.filter(c=>c.join(" ").toLowerCase().includes(q));
  $("#cl").innerHTML=L.map((c,i)=>`<div class="card"><b>${esc(c[0])}</b><div class="mut">CAS ${esc(c[1])} · ${esc(c[2])}</div><div class="mut">Used in: ${esc(c[3])}</div><div class="acts"><button class="btn sm" onclick="prefill={chem:'${esc(c[0])}',cas:'${esc(c[1])}'};go('buyer')">Create RFQ</button></div></div>`).join("")||'<p class="mut">No matches. Try another name or CAS number.</p>'}
function rData(){
  $("#v-data").innerHTML=`<h2>Data and backup</h2><div class="card" style="margin-bottom:12px"><h3>Shared database</h3><p class="mut">Supabase: <b>${SB_ON?"configured but untested":"not connected"}</b>. All data here lives in this browser only. A page published on Claude cannot reach outside servers, so the shared-database version must be hosted elsewhere.</p></div><div class="card"><h3>Export</h3><p class="mut">Creates a JSON copy of every RFQ, quotation and activity entry.</p><div class="acts"><button class="btn" onclick="exp()">Show JSON</button><button class="btn sec" onclick="cp()">Copy JSON</button><button class="btn sec" onclick="dl()">Try download</button></div><textarea id="ex" class="hide" style="min-height:180px;margin-top:10px" readonly></textarea></div>
  <div class="card" style="margin-top:12px"><h3>Import</h3><p class="mut">Paste JSON exported earlier. This replaces current data.</p><textarea id="im" placeholder="Paste JSON here"></textarea><div class="acts"><button class="btn sec" onclick="imp()">Import JSON</button></div></div>
  <div class="card" style="margin-top:12px"><h3>Reset</h3><div class="acts"><button class="btn sec" onclick="S=demo();save();toast('Demo data restored');rData()">Restore demo data</button><button class="btn sec" onclick="loadScn()">Add sample-stage test scenario</button><button class="btn danger" onclick="S={rfqs:[],quotes:[],act:[]};save();toast('All data cleared');rData()">Clear everything</button></div></div>
  <div class="card" style="margin-top:12px"><h3>Limits of this prototype</h3><p class="mut">Data lives in this browser only. Clearing browser data deletes it, and other people or devices cannot see it. There is no login, no real supplier verification and no live pricing. Demo entries are fictional.</p></div>`;
}
function loadScn(){const now=Date.now();
  for(let i=12;i>=1;i--)S.rfqs.unshift({id:uid(),chem:"Placeholder ingredient "+i+" (test)",cas:"",grade:"",qty:10,unit:"g",spec:"10 g sample request. Replace with the real ingredient and specification.",loc:"",date:"",buyer:"Test buyer (sample-stage scenario)",docs:["COA","SDS"],status:"Sample requested",track:{sample:"10 g sample requested. Delivery details are not stored in this scenario.",test:"Not tested yet"},demo:true,scn:true,created:now});
  log("Added sample-stage test scenario (12 placeholder items)");save();toast("Test scenario added");go("track")}
const js=()=>JSON.stringify({app:"ChemicalOS MVP v1",exported:new Date().toISOString(),rfqs:S.rfqs,quotes:S.quotes,activity:S.act,listings:LS(),orders:OS()},null,2);
function exp(){const t=$("#ex");t.value=js();t.classList.remove("hide");t.select()}
function cp(){exp();try{navigator.clipboard.writeText(js()).then(()=>toast("JSON copied"),()=>toast("Copy blocked. Select the text and copy it by hand."))}catch(e){toast("Copy blocked. Select the text and copy it by hand.")}}
function dl(){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([js()],{type:"application/json"}));a.download="chemicalos-export.json";document.body.appendChild(a);a.click();a.remove();toast("If no file appeared, use Copy JSON instead.")}catch(e){toast("Download blocked here. Use Copy JSON.")}}
function imp(){try{const o=JSON.parse($("#im").value);if(!Array.isArray(o.rfqs)||!Array.isArray(o.quotes))throw 0;const cl=s=>String(s==null?"":s).replace(/[^A-Za-z0-9_-]/g,"").slice(0,24);
  S={rfqs:o.rfqs.map(r=>Object.assign({},r,{id:cl(r.id)||uid()})),quotes:o.quotes.map(q=>Object.assign({docs:[]},q,{id:cl(q.id)||uid(),rfq:cl(q.rfq)})),act:o.activity||o.act||[],listings:(o.listings||[]).map(l=>Object.assign({},l,{id:cl(l.id)||uid()})),orders:(o.orders||[]).map(x=>Object.assign({},x,{id:cl(x.id)||uid(),listing:cl(x.listing)}))};log("Data imported");save();toast("Imported "+S.rfqs.length+" RFQs");rData()}catch(e){toast("That is not valid ChemicalOS JSON.")}}
$("#lg0").src=LOGO;go("home");
</script>
</body>
</html>
