name: Validate ChemicalOS frontend

on:
  push:
    branches:
      - feature/supabase-integration
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and check inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim().length > 0);
          if (scripts.length === 0) throw new Error('No inline JavaScript found');
          fs.writeFileSync('/tmp/chemicalos-inline.js', scripts.join('\\n;\\n'));
          NODE
          node --check /tmp/chemicalos-inline.js
